<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>課堂互動計分板</title>
    <style>
        :root {
            --primary-color: #4CAF50;
            --danger-color: #f44336;
            --bg-color: #fcfcfc;
        }
        body {
            margin: 0; padding: 0;
            font-family: 'Microsoft JhengHei', sans-serif;
            background: transparent; /* 背景透明 */
            height: 100vh;
            overflow: hidden;
        }

        /* 滿版覆蓋層：平常透明不擋點擊，展開時才啟用 */
        #overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.3); z-index: 998;
            display: none;
        }

        /* 觸控優化懸浮鈕 */
        #toggle-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
            background: linear-gradient(135deg, #ff9800, #ff5722);
            color: white;
            border: none;
            padding: 14px 24px;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 6px 15px rgba(0,0,0,0.3);
            font-size: 16px;
            font-weight: bold;
        }

        /* 側邊抽屜面板 */
        #side-panel {
            position: fixed;
            top: 0;
            right: -360px; 
            width: 340px;
            height: 100vh;
            background: white;
            box-shadow: -5px 0 25px rgba(0,0,0,0.2);
            z-index: 999;
            transition: right 0.3s cubic-bezier(0.1, 0.9, 0.2, 1);
            display: flex;
            flex-direction: column;
            padding: 25px 20px;
            box-sizing: border-box;
        }
        #side-panel.open {
            right: 0; 
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #eee;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }
        .panel-header h3 { margin: 0; color: #333; font-size: 20px; }
        .close-panel { cursor: pointer; font-size: 24px; color: #aaa; padding: 5px; }

        /* 列表區 */
        .grid-container {
            overflow-y: auto;
            flex-grow: 1;
            padding-right: 5px;
        }
        .team-card {
            background: var(--bg-color);
            border: 1px solid #eef0f5;
            border-radius: 12px;
            padding: 12px 15px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 6px solid #2196F3;
            box-shadow: 0 4px 6px rgba(0,0,0,0.02);
        }
        .team-info { display: flex; flex-direction: column; }
        .team-name { font-weight: bold; font-size: 16px; color: #333; }
        .team-score { font-size: 22px; color: #ff5722; font-weight: bold; margin-top: 3px; }
        
        .action-btns { display: flex; align-items: center; }
        .action-btns button {
            width: 40px; height: 40px;
            border-radius: 50%;
            border: none;
            font-size: 20px;
            font-weight: bold;
            color: white;
            cursor: pointer;
            margin-left: 8px;
        }
        .btn-plus { background-color: var(--primary-color); }
        .btn-minus { background-color: var(--danger-color); }

        /* 設定區域 */
        .config-area {
            border-top: 1px solid #eee;
            padding-top: 15px;
            margin-top: 10px;
        }
        .config-area textarea {
            width: 100%; height: 60px;
            box-sizing: border-box;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 8px;
            padding: 8px;
            font-size: 13px;
            resize: none;
        }
        .config-area button {
            width: 100%; padding: 10px;
            background-color: #2196F3; color: white;
            border: none; border-radius: 8px; cursor: pointer;
            font-size: 15px; font-weight: bold;
        }
        
        /* 慶祝特效 */
        #celebrate {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            font-size: 120px; pointer-events: none; display: none; z-index: 1001;
            animation: pop 0.6s ease-out forwards;
        }
        @keyframes pop {
            0% { transform: translate(-50%, -50%) scale(0.3); opacity: 0; }
            50% { transform: translate(-50%, -50%) scale(1.3); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(1); opacity: 0; }
        }
    </style>
</head>
<body>

    <!-- 遮罩 -->
    <div id="overlay" onclick="togglePanel()"></div>

    <!-- 右上角懸浮鈕（全螢幕時才會用到） -->
    <button id="toggle-btn" onclick="togglePanel()">⭐ 班級紀錄</button>

    <!-- 側邊抽屜 -->
    <div id="side-panel">
        <div class="panel-header">
            <h3>🏫 課堂互動計分板</h3>
            <span class="close-panel" onclick="togglePanel()">✕</span>
        </div>
        <div class="grid-container" id="list-container"></div>
        <div class="config-area">
            <textarea id="names-input" placeholder="輸入組名或名字，用逗號或換行隔開"></textarea>
            <button onclick="updateTeams()">更新名單</button>
        </div>
    </div>

    <div id="celebrate">🎉</div>

    <script>
        let teams = JSON.parse(localStorage.getItem('tab_class_teams')) || [
            { name: "第一組", score: 0 }, { name: "第二組", score: 0 },
            { name: "第三組", score: 0 }, { name: "第四組", score: 0 }
        ];

        function togglePanel() {
            const panel = document.getElementById('side-panel');
            const overlay = document.getElementById('overlay');
            panel.classList.toggle('open');
            if(panel.classList.contains('open')) {
                overlay.style.display = 'block';
            } else {
                overlay.style.display = 'none';
            }
        }

        function renderList() {
            const container = document.getElementById('list-container');
            container.innerHTML = '';
            teams.forEach((team, index) => {
                const card = document.createElement('div');
                card.className = 'team-card';
                card.innerHTML = `
                    <div class="team-info"><span class="team-name">${team.name}</span><span class="team-score" id="score-${index}">${team.score} 分</span></div>
                    <div class="action-btns">
                        <button class="btn-minus" onclick="changeScore(${index}, -1)">-</button>
                        <button class="btn-plus" onclick="changeScore(${index}, 1)">+</button>
                    </div>
                `;
                container.appendChild(card);
            });
            document.getElementById('names-input').value = teams.map(t => t.name).join(', ');
        }

        function changeScore(index, value) {
            teams[index].score += value;
            if(teams[index].score < 0) teams[index].score = 0;
            document.getElementById(`score-${index}`).innerText = `${teams[index].score} 分`;
            localStorage.setItem('tab_class_teams', JSON.stringify(teams));
            if (value > 0) {
                const cb = document.getElementById('celebrate');
                cb.style.display = 'block';
                setTimeout(() => { cb.style.display = 'none'; }, 600);
            }
        }

        function updateTeams() {
            const input = document.getElementById('names-input').value;
            const names = input.split(/[\n,，]+/).map(n => n.trim()).filter(n => n !== '');
            if (names.length === 0) return alert('請輸入名字！');
            teams = names.map(name => ({ name: name, score: 0 }));
            localStorage.setItem('tab_class_teams', JSON.stringify(teams));
            renderList();
        }

        // 監聽鍵盤空白鍵，按下空白鍵直接開關選單
        window.addEventListener('keydown', function(e) {
            if(e.code === 'Space' && document.activeElement.tagName !== 'TEXTAREA') {
                e.preventDefault();
                togglePanel();
            }
        });

        renderList();
    </script>
</body>
</html>
